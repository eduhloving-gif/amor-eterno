<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Nosso Amor é Infinito</title>

<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
margin:0;
font-family: Arial;
background: linear-gradient(135deg,#ff4b7d,#ff9a9e);
height:100vh;
overflow:hidden;
color:white;
}

#contador {
position:fixed;
top:10px;
width:100%;
text-align:center;
font-size:18px;
z-index:5;
}

.popup {
position:absolute;
background:white;
color:#ff4b7d;
padding:15px 20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.4);
cursor:pointer;
animation: aparecer .3s;
max-width:220px;
text-align:center;
}

@keyframes aparecer {
from {transform:scale(.5); opacity:0;}
to {transform:scale(1); opacity:1;}
}

.heart {
position:fixed;
top:-10px;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall {
to { transform: translateY(110vh); }
}

#final {
display:none;
position:fixed;
inset:0;
background:white;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:999;
}

#final h1 {
font-family:'Pacifico', cursive;
color:#ff4b7d;
font-size:48px;
text-align:center;
}

#final p {
color:#888;
margin-top:10px;
}
</style>
</head>

<body>

<div id="contador"></div>

<div id="final">
<h1>Eu te amo mil milhões ❤️</h1>
<p>— tipo Vingadores mesmo 😅</p>
</div>

<script>
const inicio = new Date("2010-03-19");

function atualizar() {
const agora=new Date();
let anos=agora.getFullYear()-inicio.getFullYear();
let meses=agora.getMonth()-inicio.getMonth();
let dias=agora.getDate()-inicio.getDate();
let horas=agora.getHours()-inicio.getHours();

if(horas<0){horas+=24;dias--;}
if(dias<0){meses--;dias+=new Date(agora.getFullYear(),agora.getMonth(),0).getDate();}
if(meses<0){anos--;meses+=12;}

contador.innerHTML="Desde 19/03/2010 ❤️<br>Juntos há:<br><b>"+anos+
"</b> anos, <b>"+meses+"</b> meses,<br><b>"+dias+
"</b> dias e <b>"+horas+"</b> horas 💕";
}

setInterval(atualizar,1000); atualizar();

const mensagens=[
"Eu te amo ❤️","Minha melhor escolha","Você é meu lar","Minha eternidade",
"Te escolheria mil vezes","Meu coração é seu","Companheira de vida",
"Meu porto seguro","Você é meu mundo","Minha paz","Meu sorriso diário",
"Amor da minha vida","Só nós dois 💕","Meu tudo","Destino","Amor infinito ♾️"
];

let cliques=0;

function segredo(){
if(cliques==10) alert("10 cliques 😍 Já deu pra perceber que eu te amo né?");
if(cliques==25) alert("25 cliques ❤️ Obrigado por caminhar comigo nesses 16 anos.");
if(cliques==50) alert("50 cliques 💕 Você é minha melhor história.");
if(cliques==100) alert("100 cliques 😭 Prepare-se...");
}

function finalMarvel(){
document.body.innerHTML="";
document.body.appendChild(document.getElementById("final"));
final.style.display="flex";

setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.animationDuration=Math.random()*2+1+"s";
document.body.appendChild(h);
},100);
}

function criarPopup(){
const d=document.createElement("div");
d.className="popup";
d.innerHTML=mensagens[Math.floor(Math.random()*mensagens.length)];
d.style.left=Math.random()*80+"%";
d.style.top=Math.random()*80+"%";

d.onclick=()=>{
cliques++;
segredo();
d.remove();

if(cliques>=101){
finalMarvel();
return;
}

// duplica
criarPopup();
criarPopup();
};

document.body.appendChild(d);
}

criarPopup();
</script>

</body>
</html>
