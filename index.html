<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Nosso Amor é Infinito</title>

<style>
body {
margin:0;
font-family: Arial;
background: linear-gradient(135deg,#ff4b7d,#ff9a9e);
height:100vh;
overflow:hidden;
color:white;
}

#contador {
position:fixed;
top:10px;
width:100%;
text-align:center;
font-size:18px;
}

.popup {
position:absolute;
background:white;
color:#ff4b7d;
padding:15px 20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.4);
cursor:pointer;
animation: aparecer .3s;
max-width:220px;
text-align:center;
}

@keyframes aparecer {
from {transform:scale(.5); opacity:0;}
to {transform:scale(1); opacity:1;}
}

.heart {
position:fixed;
top:-10px;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall {
to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div id="contador"></div>

<script>
const inicio = new Date("2010-03-19");

const mensagens = [
"Eu te amo ❤️",
"16 anos do seu lado 😍",
"Você é meu lar",
"Minha melhor escolha",
"Pra sempre nós dois",
"Nem clicando você foge 😌",
"Meu amor é infinito",
"Você é minha eternidade",
"Obrigado por existir",
"Te escolheria mil vezes",
"Meu coração é seu",
"Companheira de vida ❤️"
];

// contador
function atualizar() {
const agora = new Date();

let anos = agora.getFullYear() - inicio.getFullYear();
let meses = agora.getMonth() - inicio.getMonth();
let dias = agora.getDate() - inicio.getDate();
let horas = agora.getHours() - inicio.getHours();

if (horas < 0) {
horas += 24;
dias--;
}

if (dias < 0) {
meses--;
const ultimoDia = new Date(agora.getFullYear(), agora.getMonth(), 0).getDate();
dias += ultimoDia;
}

if (meses < 0) {
anos--;
meses += 12;
}

document.getElementById("contador").innerHTML =
"Desde 19/03/2010 ❤️<br>" +
"Juntos há:<br>" +
"<b>"+anos+"</b> anos, <b>"+meses+"</b> meses,<br>" +
"<b>"+dias+"</b> dias e <b>"+horas+"</b> horas 💕";
}

atualizar();
setInterval(atualizar, 1000);


// cria popup eterno
function criarPopup() {
const div = document.createElement("div");
div.className = "popup";

div.innerHTML = mensagens[Math.floor(Math.random()*mensagens.length)];

div.style.left = Math.random()*70 + "%";
div.style.top = Math.random()*70 + "%";

div.onclick = () => {
div.remove();
setTimeout(criarPopup,200);
};

document.body.appendChild(div);
}

// começa com 3
criarPopup();
criarPopup();
criarPopup();

// cria sempre novos
setInterval(criarPopup,2000);

// corações caindo
setInterval(() => {
const heart = document.createElement("div");
heart.classList.add("heart");
heart.innerHTML = "❤️";
heart.style.left = Math.random()*100 + "vw";
heart.style.animationDuration = Math.random()*3+2+"s";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),5000);
},300);

</script>

</body>
</html>
