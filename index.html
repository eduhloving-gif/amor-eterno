<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Nosso Amor é Infinito</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family: Arial;
  background: linear-gradient(135deg,#ff4b7d,#ff9a9e);
  height:100vh;
  overflow:hidden;
  color:white;
}

#contador {
  position:fixed;
  top:10px;
  width:100%;
  text-align:center;
  font-size:18px;
  z-index:5;
}

.popup {
  position:absolute;
  background:white;
  color:#ff4b7d;
  padding:12px 18px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,.4);
  cursor:pointer;
}

.heart {
  position:fixed;
  top:-10px;
  font-size:20px;
  animation: fall linear infinite;
}

@keyframes fall {
  to { transform: translateY(110vh); }
}

#final {
  display:none;
  position:fixed;
  inset:0;
  background:white;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:999;
}

#final h1 {
  font-family:'Pacifico',cursive;
  color:#ff4b7d;
  font-size:48px;
  text-align:center;
}

#final p {
  color:#888;
  margin-top:10px;
}
</style>
</head>

<body>

<div id="contador"></div>

<div id="final">
  <h1>Eu te amo mil milhões ❤️</h1>
  <p>— tipo Vingadores mesmo 😅</p>
</div>

<script>

// ===== CONTADOR JUNTOS =====
const inicio = new Date("2010-03-19");

function atualizarContador() {
  const agora = new Date();
  let anos = agora.getFullYear() - inicio.getFullYear();
  let meses = agora.getMonth() - inicio.getMonth();
  let dias = agora.getDate() - inicio.getDate();

  if (dias < 0) { meses--; dias += 30; }
  if (meses < 0) { anos--; meses += 12; }

  contador.innerHTML = 
    `Desde 19/03/2010 ❤️<br>`+
    `${anos} anos, ${meses} meses, ${dias} dias juntos 💕`;
}

setInterval(atualizarContador, 1000);
atualizarContador();

// ===== MENSAGENS DOS POPUPS =====
const frases = [
  "Eu te amo ❤️","Meu tudo","Minha eternidade","Você é meu lar",
  "Amor infinito ♾️","Minha melhor escolha","Pra sempre nós",
  "Meu coração é seu","Minha paz","Meu mundo","Minha alegria",
  "Você é minha vida","Meu sorriso diário","Pra sempre ao seu lado",
  "Obrigado por existir","Você é meu destino","Meu amor cresce",
  "Minha metade perfeita","Meu eterno lar","Você é meu presente"
];

let cliques = 0;

// ===== PROGRAMA FINAL =====
function showFinal() {
  document.querySelectorAll(".popup").forEach(p => p.remove());
  contador.remove();
  final.style.display = "flex";

  setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.animationDuration = Math.random()*2+1+"s";
    document.body.appendChild(heart);
  }, 80);
}

// ===== CRIAR POPUP =====
function criarPopup() {
  const div = document.createElement("div");
  div.className = "popup";
  div.innerHTML = frases[Math.floor(Math.random()*frases.length)];

  div.style.left = Math.random()*80 + "%";
  div.style.top = Math.random()*80 + "%";

div.onclick = () => {
  cliques++;

  if (cliques === 10) alert("10 cliques 😍");
  if (cliques === 25) alert("25 cliques ❤️");
  if (cliques === 50) alert("50 cliques 💕");
  if (cliques === 100) alert("100 cliques... prepare-se!");

  const total = document.querySelectorAll(".popup").length;

  if (cliques >= 101) {
    showFinal();
    return;
  }

  for (let i = 0; i < total; i++) {
    criarPopup();
  }

  div.remove();
};


  document.body.appendChild(div);
}

// ===== INICIA =====
criarPopup();

</script>

</body>
</html>
