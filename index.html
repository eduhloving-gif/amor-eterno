<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Nosso Amor é Infinito</title>

<style>
body {
margin:0;
font-family: Arial;
background: linear-gradient(135deg,#ff4b7d,#ff9a9e);
height:100vh;
overflow:hidden;
color:white;
}

#contador {
position:fixed;
top:10px;
width:100%;
text-align:center;
font-size:18px;
z-index:5;
}

.popup {
position:absolute;
background:white;
color:#ff4b7d;
padding:15px 20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.4);
cursor:pointer;
animation: aparecer .3s;
max-width:220px;
text-align:center;
}

@keyframes aparecer {
from {transform:scale(.5); opacity:0;}
to {transform:scale(1); opacity:1;}
}

.heart {
position:fixed;
top:-10px;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall {
to { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div id="contador"></div>

<script>
const inicio = new Date("2010-03-19");

function atualizar() {
const agora = new Date();

let anos = agora.getFullYear() - inicio.getFullYear();
let meses = agora.getMonth() - inicio.getMonth();
let dias = agora.getDate() - inicio.getDate();
let horas = agora.getHours() - inicio.getHours();

if (horas < 0) {
horas += 24;
dias--;
}

if (dias < 0) {
meses--;
const ultimoDia = new Date(agora.getFullYear(), agora.getMonth(), 0).getDate();
dias += ultimoDia;
}

if (meses < 0) {
anos--;
meses += 12;
}

document.getElementById("contador").innerHTML =
"Desde 19/03/2010 ❤️<br>" +
"Juntos há:<br>" +
"<b>"+anos+"</b> anos, <b>"+meses+"</b> meses,<br>" +
"<b>"+dias+"</b> dias e <b>"+horas+"</b> horas 💕";
}

atualizar();
setInterval(atualizar,1000);

let cliques = 0;

const mensagens = [
"Eu te amo ❤️",
"Minha melhor escolha",
"16 anos do seu lado 😍",
"Você é meu lar",
"Minha eternidade",
"Te escolheria mil vezes",
"Nem clicando você foge 😌",
"Meu coração é seu",
"Obrigado por existir",
"Companheira de vida",
"Meu porto seguro",
"Você é meu mundo",
"Minha paz",
"Meu sorriso diário",
"Amor da minha vida",
"Só nós dois 💕",
"Pra sempre começa hoje",
"Meu tudo",
"Você é meu destino",
"Amor infinito ♾️"
];

function mensagemSecreta() {
if (cliques === 10) alert("10 cliques 😍 Já deu pra perceber que eu te amo né?");
if (cliques === 25) alert("25 cliques ❤️ Obrigado por caminhar comigo nesses 16 anos.");
if (cliques === 50) alert("50 cliques 💕 Você é minha melhor história.");
if (cliques === 100) alert("100 cliques 😭 Agora já sabe: eu nunca vou desistir da gente.");
}

function criarPopup() {
const div = document.createElement("div");
div.className = "popup";
div.innerHTML = mensagens[Math.floor(Math.random()*mensagens.length)];

div.style.left = Math.random()*70 + "%";
div.style.top = Math.random()*70 + "%";

div.onclick = () => {
cliques++;
mensagemSecreta();
div.remove();
setTimeout(criarPopup,150);
};

document.body.appendChild(div);
}

// inicia
criarPopup();
criarPopup();
criarPopup();

// loop infinito
setInterval(criarPopup,1500);

// corações
setInterval(() => {
const heart = document.createElement("div");
heart.classList.add("heart");
heart.innerHTML = "❤️";
heart.style.left = Math.random()*100 + "vw";
heart.style.animationDuration = Math.random()*3+2+"s";
document.body.appendChild(heart);

setTimeout(()=>heart.remove(),5000);
},300);
</script>

</body>
</html>
